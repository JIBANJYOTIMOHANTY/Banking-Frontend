<div class="flex h-screen bg-gray-100">

        <!-- Sidebar -->
        <aside class="fixed lg:relative z-50 w-64 h-full bg-blue-900 text-white transition-transform duration-300"
                [class.-translate-x-full]="!sidebarOpen" [class.translate-x-0]="sidebarOpen">
                <div class="p-5 border-b border-blue-700">
                        <h2 class="text-2xl font-bold">Bank Admin</h2>
                </div>

                <nav class="mt-4">
                        <a class="block px-6 py-3 hover:bg-blue-800 cursor-pointer">
                                Dashboard
                        </a>
                        <a class="block px-6 py-3 hover:bg-blue-800 cursor-pointer">
                                Customers
                        </a>
                        <a class="block px-6 py-3 hover:bg-blue-800 cursor-pointer">
                                Accounts
                        </a>
                        <a class="block px-6 py-3 hover:bg-blue-800 cursor-pointer">
                                Transactions
                        </a>
                        <a class="block px-6 py-3 hover:bg-blue-800 cursor-pointer">
                                Reports
                        </a>
                </nav>
        </aside>

        <!-- Overlay -->
        @if (sidebarOpen) {
        <div (click)="sidebarOpen = false" class="fixed inset-0 bg-black/40 lg:hidden z-40"></div>
        }

        <!-- Main Content -->
        <div class="flex-1 overflow-auto">

                <!-- Header -->
                <header class="bg-white shadow px-4 md:px-6 py-4 flex items-center justify-between">

                        <div class="flex items-center gap-4">
                                <button class="lg:hidden text-2xl" (click)="sidebarOpen = !sidebarOpen">
                                        ☰
                                </button>

                                <h1 class="text-xl md:text-2xl font-bold">
                                        Banking Dashboard
                                </h1>
                        </div>

                        <div class="flex items-center gap-4">
                                <button class="relative">
                                        🔔
                                        <span
                                                class="absolute -top-2 -right-2 bg-red-500 text-white text-xs rounded-full px-1">
                                                5
                                        </span>
                                </button>

                                <img src="https://i.pravatar.cc/40" alt="User" class="w-10 h-10 rounded-full" />
                        </div>

                </header>

                <!-- Content -->
                <main class="p-4 md:p-6">

                        <div class="grid grid-cols-1 sm:grid-cols-2 xl:grid-cols-4 gap-6">

                                <div class="bg-white rounded-xl shadow p-5">
                                        <p class="text-gray-500">Customers</p>
                                        <h2 class="text-3xl font-bold text-blue-900">12,548</h2>
                                </div>

                                <div class="bg-white rounded-xl shadow p-5">
                                        <p class="text-gray-500">Accounts</p>
                                        <h2 class="text-3xl font-bold text-green-600">18,920</h2>
                                </div>

                                <div class="bg-white rounded-xl shadow p-5">
                                        <p class="text-gray-500">Deposits</p>
                                        <h2 class="text-3xl font-bold text-purple-600">₹52.4 Cr</h2>
                                </div>

                                <div class="bg-white rounded-xl shadow p-5">
                                        <p class="text-gray-500">Pending Approvals</p>
                                        <h2 class="text-3xl font-bold text-red-500">34</h2>
                                </div>

                        </div>

                </main>

        </div>

</div>
