<div class="fixed inset-0 flex items-center justify-center z-[9999] p-4 animate-fade-in">
  <!-- Backdrop Overlay with blur -->
  <div class="absolute inset-0 bg-slate-900/60 backdrop-blur-md transition-opacity duration-300"></div>

  <!-- Modal Container -->
  <div class="relative w-full max-w-md bg-white border border-slate-100 rounded-3xl p-8 shadow-2xl relative z-10 flex flex-col items-center text-center space-y-6 animate-scale-up">
    <!-- Icon Circle with Pulse Effect -->
    <div class="relative flex items-center justify-center">
      <div class="absolute w-20 h-20 bg-rose-500/10 rounded-full animate-ping duration-1000"></div>
      <div class="w-16 h-16 rounded-2xl bg-rose-50 text-rose-600 flex items-center justify-center shadow-inner relative z-10">
        <span class="material-icons text-3xl">wifi_off</span>
      </div>
    </div>

    <!-- Title and message -->
    <div class="space-y-2">
      <h3 class="text-xl font-extrabold text-slate-800 tracking-tight">Connection Lost</h3>
      <p class="text-sm font-medium text-slate-500 leading-relaxed max-w-sm">
        We are unable to connect to our servers. Please check your internet connection or try again.
      </p>
      @if (checkFailed()) {
        <p class="text-xs font-semibold text-rose-500 animate-shake">
          Still unable to reach the server. Please try again in a moment.
        </p>
      }
    </div>

    <!-- Action Button -->
    <button (click)="onRetry()" [disabled]="isChecking()"
      class="w-full py-3.5 bg-indigo-600 hover:bg-indigo-700 disabled:bg-indigo-400 text-white rounded-2xl font-bold text-sm shadow-lg shadow-indigo-500/20 hover:shadow-indigo-500/30 transition-all duration-200 cursor-pointer flex items-center justify-center space-x-2">
      @if (isChecking()) {
        <span class="w-4 h-4 border-2 border-white border-t-transparent rounded-full animate-spin"></span>
        <span>Checking Connection...</span>
      } @else {
        <span>Retry Connection</span>
      }
    </button>
  </div>
</div>
