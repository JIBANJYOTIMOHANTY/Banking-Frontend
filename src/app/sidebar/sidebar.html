<aside
  class="fixed lg:relative z-50 w-64 h-full bg-slate-900 text-slate-100 flex flex-col justify-between transition-transform duration-300 shadow-2xl border-r border-slate-800"
  [class.-translate-x-full]="!isOpen" [class.translate-x-0]="isOpen" [class.lg:hidden]="!isOpen">
  <div>
    <!-- Brand Title & Close btn -->
    <div class="p-6 border-b border-slate-800 flex items-center justify-between">
      <div class="flex items-center gap-3">
        <div class="w-9 h-9 rounded-lg bg-indigo-600 flex items-center justify-center shadow-lg shadow-indigo-500/30">
          <span class="material-icons text-white text-xl">account_balance</span>
        </div>
        <h2
          class="text-xl font-bold tracking-tight text-white bg-clip-text text-transparent bg-gradient-to-r from-white to-slate-400">
          TrustBank
        </h2>
      </div>
      <button (click)="close.emit()"
        class="lg:hidden p-1.5 rounded-lg bg-slate-800 hover:bg-slate-700 text-slate-400 hover:text-white transition-colors cursor-pointer"
        aria-label="Close sidebar">
        <span class="material-icons text-xl">close</span>
      </button>
    </div>

    <!-- Navigation Menu -->
    <nav class="mt-6 px-4 space-y-1.5">
      <a (click)="setActive('Dashboard')" [class.bg-indigo-600]="activeItem === 'Dashboard'"
        [class.text-white]="activeItem === 'Dashboard'" [class.shadow-lg]="activeItem === 'Dashboard'"
        [class.shadow-indigo-500/20]="activeItem === 'Dashboard'" [class.bg-slate-800\/50]="activeItem !== 'Dashboard'"
        [class.text-slate-400]="activeItem !== 'Dashboard'"
        class="flex items-center gap-3 px-4 py-3 rounded-xl hover:text-white hover:bg-slate-800 transition-all duration-200 cursor-pointer group">
        <span class="material-icons transition-colors duration-200"
          [class.text-indigo-400]="activeItem !== 'Dashboard'">dashboard</span>
        <span class="font-medium text-sm">Dashboard</span>
      </a>

      <a (click)="setActive('Customers')" [class.bg-indigo-600]="activeItem === 'Customers'"
        [class.text-white]="activeItem === 'Customers'" [class.shadow-lg]="activeItem === 'Customers'"
        [class.shadow-indigo-500/20]="activeItem === 'Customers'" [class.bg-slate-800\/50]="activeItem !== 'Customers'"
        [class.text-slate-400]="activeItem !== 'Customers'"
        class="flex items-center gap-3 px-4 py-3 rounded-xl hover:text-white hover:bg-slate-800 transition-all duration-200 cursor-pointer group">
        <span class="material-icons transition-colors duration-200"
          [class.text-indigo-400]="activeItem !== 'Customers'">people</span>
        <span class="font-medium text-sm">Customers</span>
      </a>

      <a (click)="setActive('Accounts')" [class.bg-indigo-600]="activeItem === 'Accounts'"
        [class.text-white]="activeItem === 'Accounts'" [class.shadow-lg]="activeItem === 'Accounts'"
        [class.shadow-indigo-500/20]="activeItem === 'Accounts'" [class.bg-slate-800\/50]="activeItem !== 'Accounts'"
        [class.text-slate-400]="activeItem !== 'Accounts'"
        class="flex items-center gap-3 px-4 py-3 rounded-xl hover:text-white hover:bg-slate-800 transition-all duration-200 cursor-pointer group">
        <span class="material-icons transition-colors duration-200"
          [class.text-indigo-400]="activeItem !== 'Accounts'">account_balance_wallet</span>
        <span class="font-medium text-sm">Accounts</span>
      </a>

      <a (click)="setActive('Transactions')" [class.bg-indigo-600]="activeItem === 'Transactions'"
        [class.text-white]="activeItem === 'Transactions'" [class.shadow-lg]="activeItem === 'Transactions'"
        [class.shadow-indigo-500/20]="activeItem === 'Transactions'"
        [class.bg-slate-800\/50]="activeItem !== 'Transactions'" [class.text-slate-400]="activeItem !== 'Transactions'"
        class="flex items-center gap-3 px-4 py-3 rounded-xl hover:text-white hover:bg-slate-800 transition-all duration-200 cursor-pointer group">
        <span class="material-icons transition-colors duration-200"
          [class.text-indigo-400]="activeItem !== 'Transactions'">receipt_long</span>
        <span class="font-medium text-sm">Transactions</span>
      </a>

      <a (click)="setActive('Reports')" [class.bg-indigo-600]="activeItem === 'Reports'"
        [class.text-white]="activeItem === 'Reports'" [class.shadow-lg]="activeItem === 'Reports'"
        [class.shadow-indigo-500/20]="activeItem === 'Reports'" [class.bg-slate-800\/50]="activeItem !== 'Reports'"
        [class.text-slate-400]="activeItem !== 'Reports'"
        class="flex items-center gap-3 px-4 py-3 rounded-xl hover:text-white hover:bg-slate-800 transition-all duration-200 cursor-pointer group">
        <span class="material-icons transition-colors duration-200"
          [class.text-indigo-400]="activeItem !== 'Reports'">assessment</span>
        <span class="font-medium text-sm">Reports</span>
      </a>

      <a (click)="setActive('Settings')" [class.bg-indigo-600]="activeItem === 'Settings'"
        [class.text-white]="activeItem === 'Settings'" [class.shadow-lg]="activeItem === 'Settings'"
        [class.shadow-indigo-500/20]="activeItem === 'Settings'" [class.bg-slate-800\/50]="activeItem !== 'Settings'"
        [class.text-slate-400]="activeItem !== 'Settings'"
        class="flex items-center gap-3 px-4 py-3 rounded-xl hover:text-white hover:bg-slate-800 transition-all duration-200 cursor-pointer group">
        <span class="material-icons transition-colors duration-200"
          [class.text-indigo-400]="activeItem !== 'Settings'">settings</span>
        <span class="font-medium text-sm">Settings</span>
      </a>
    </nav>
  </div>

  <!-- Logout/Profile section in Sidebar Footer -->
  <div class="p-4 border-t border-slate-800 bg-slate-950/40">
    <div class="flex items-center justify-between">
      <div class="flex items-center gap-2">
        <div class="w-8 h-8 rounded-full bg-indigo-500/20 flex items-center justify-center">
          <span class="material-icons text-indigo-400 text-sm">admin_panel_settings</span>
        </div>
        <div>
          <p class="text-xs font-bold text-white">System Admin</p>
          <p class="text-[10px] text-slate-500">Online</p>
        </div>
      </div>
      <button (click)="logout()"
        class="p-1.5 rounded-lg hover:bg-slate-800 text-slate-400 hover:text-red-400 transition-colors cursor-pointer"
        title="Sign Out">
        <span class="material-icons text-lg">logout</span>
      </button>
    </div>
  </div>
</aside>
