<div class="min-h-screen flex items-center justify-center bg-gray-100 px-4">
    <div class="w-full max-w-5xl bg-white rounded-2xl shadow-xl overflow-hidden grid md:grid-cols-2">
        <!-- Left Section -->
        <div class="hidden md:flex flex-col justify-center bg-indigo-600 text-white p-10">
            <h1 class="text-4xl font-bold mb-4">Admin Portal</h1>
            <p class="text-lg text-indigo-100">
                Securely manage users, monitor system activity, and access administrative
                tools from a centralized dashboard.
            </p>

            <div class="mt-8">
                <img src="https://cdn-icons-png.flaticon.com/512/3135/3135715.png" alt="Admin" class="w-48 mx-auto" />
            </div>
        </div>

        <!-- Right Section -->
        <div class="p-6 sm:p-8 md:p-12">
            <div class="max-w-md mx-auto">
                <div class="text-center mb-8">
                    <div class="w-16 h-16 bg-indigo-100 rounded-full flex items-center justify-center mx-auto mb-4">
                        <svg xmlns="http://www.w3.org/2000/svg" class="h-8 w-8 text-indigo-600" fill="none"
                            viewBox="0 0 24 24" stroke="currentColor">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                                d="M12 11c1.657 0 3-1.343 3-3s-1.343-3-3-3-3 1.343-3 3 1.343 3 3 3zm0 2c-2.761 0-5 2.239-5 5h10c0-2.761-2.239-5-5-5z" />
                        </svg>
                    </div>

                    <h2 class="text-3xl font-bold text-gray-800">
                        Administrator Login
                    </h2>
                    <p class="text-gray-500 mt-2">
                        Sign in to access the admin dashboard
                    </p>
                </div>

                <form class="space-y-5">
                    <!-- Email -->
                    <div>
                        <label class="block text-sm font-medium text-gray-700 mb-2">
                            Email Address
                        </label>
                        <input type="email" placeholder="admin@example.com"
                            class="w-full px-4 py-3 border rounded-lg focus:ring-2 focus:ring-indigo-500 focus:outline-none" />
                    </div>

                    <!-- Password -->
                    <div>
                        <label class="block text-sm font-medium text-gray-700 mb-2">
                            Password
                        </label>
                        <input type="password" placeholder="Enter password"
                            class="w-full px-4 py-3 border rounded-lg focus:ring-2 focus:ring-indigo-500 focus:outline-none" />
                    </div>

                    <!-- Remember Me -->
                    <div class="flex items-center justify-between">
                        <label class="flex items-center">
                            <input type="checkbox" class="h-4 w-4 text-indigo-600 border-gray-300 rounded" />
                            <span class="ml-2 text-sm text-gray-600">
                                Remember me
                            </span>
                        </label>

                        <a href="#" class="text-sm text-indigo-600 hover:text-indigo-700">
                            Forgot Password?
                        </a>
                    </div>

                    <!-- Login Button -->
                    <button type="submit"
                        class="w-full bg-indigo-600 hover:bg-indigo-700 text-white py-3 rounded-lg font-semibold transition duration-300">
                        Sign In
                    </button>
                </form>

                <div class="mt-6 text-center">
                    <p class="text-sm text-gray-500">
                        Protected Administrator Access
                    </p>
                </div>
            </div>
        </div>
    </div>
</div>
