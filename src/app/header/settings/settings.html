<div class="space-y-6 animate-in fade-in slide-in-from-bottom-2 duration-200">
  
  @if (settingsSuccessMessage()) {
    <div class="p-3 bg-emerald-50 text-emerald-700 rounded-xl text-xs font-bold border border-emerald-100">
      {{ settingsSuccessMessage() }}
    </div>
  }

  <div class="space-y-4">
    <div class="space-y-2">
      <label class="text-[10px] font-bold uppercase tracking-wider text-slate-400">Visual Theme</label>
      <div class="grid grid-cols-2 sm:grid-cols-4 gap-3">
        <button (click)="selectTheme('slate')" 
          [class.border-indigo-600]="selectedTheme() === 'slate'"
          [class.bg-slate-50]="selectedTheme() === 'slate'"
          class="p-3 border border-slate-200 rounded-xl text-center cursor-pointer transition-all hover:bg-slate-50">
          <span class="block text-xs font-bold text-slate-800">Slate Dark</span>
          <span class="text-[9px] text-slate-400 font-medium">Default Theme</span>
        </button>
        <button (click)="selectTheme('indigo')"
          [class.border-indigo-600]="selectedTheme() === 'indigo'"
          [class.bg-indigo-50/20]="selectedTheme() === 'indigo'"
          class="p-3 border border-slate-200 rounded-xl text-center cursor-pointer transition-all hover:bg-slate-50">
          <span class="block text-xs font-bold text-indigo-700">Indigo Wave</span>
          <span class="text-[9px] text-slate-400 font-medium">Vibrant UI</span>
        </button>
        <button (click)="selectTheme('emerald')"
          [class.border-indigo-600]="selectedTheme() === 'emerald'"
          [class.bg-emerald-50/20]="selectedTheme() === 'emerald'"
          class="p-3 border border-slate-200 rounded-xl text-center cursor-pointer transition-all hover:bg-slate-50">
          <span class="block text-xs font-bold text-emerald-700">Emerald Mint</span>
          <span class="text-[9px] text-slate-400 font-medium">Fresh Aesthetics</span>
        </button>
        <button (click)="selectTheme('light')"
          [class.border-indigo-600]="selectedTheme() === 'light'"
          [class.bg-slate-50]="selectedTheme() === 'light'"
          class="p-3 border border-slate-200 rounded-xl text-center cursor-pointer transition-all hover:bg-slate-50">
          <span class="block text-xs font-bold text-slate-700">Standard Light</span>
          <span class="text-[9px] text-slate-400 font-medium">Classic Clean</span>
        </button>
      </div>
    </div>

    <div class="border-t border-slate-100 my-4"></div>

    <div class="space-y-3">
      <label class="text-[10px] font-bold uppercase tracking-wider text-slate-400">Application Preferences</label>
      
      <div class="flex items-center justify-between p-3.5 bg-slate-50/50 rounded-xl border border-slate-100">
        <div>
          <h6 class="text-xs font-bold text-slate-800">Enable Real-Time Auto-Refresh</h6>
          <p class="text-[10px] text-slate-400 font-medium">Periodically fetch accounts & transactions on dashboard.</p>
        </div>
        <button (click)="toggleAutoRefresh()" 
          [class.bg-indigo-600]="enableAutoRefresh()"
          [class.bg-slate-200]="!enableAutoRefresh()"
          class="w-10 h-6 flex items-center rounded-full p-1 cursor-pointer transition-all duration-300">
          <div [class.translate-x-4]="enableAutoRefresh()"
            class="bg-white w-4 h-4 rounded-full shadow-md transform duration-300"></div>
        </button>
      </div>

      <div class="flex items-center justify-between p-3.5 bg-slate-50/50 rounded-xl border border-slate-100">
        <div>
          <h6 class="text-xs font-bold text-slate-800">Critical Desktop Alerts</h6>
          <p class="text-[10px] text-slate-400 font-medium">Trigger instant system notifications on critical lockout.</p>
        </div>
        <button (click)="toggleDesktopAlerts()" 
          [class.bg-indigo-600]="enableDesktopAlerts()"
          [class.bg-slate-200]="!enableDesktopAlerts()"
          class="w-10 h-6 flex items-center rounded-full p-1 cursor-pointer transition-all duration-300">
          <div [class.translate-x-4]="enableDesktopAlerts()"
            class="bg-white w-4 h-4 rounded-full shadow-md transform duration-300"></div>
        </button>
      </div>
    </div>
  </div>

  <div class="flex justify-end gap-3 pt-4 border-t border-slate-100">
    <button (click)="saveSettings()"
      class="px-5 py-2.5 bg-indigo-600 hover:bg-indigo-700 text-white font-bold rounded-xl text-xs transition-all cursor-pointer shadow-md">
      Save Preferences
    </button>
  </div>
</div>
