<header class="bg-white/85 backdrop-blur-md border-b border-slate-100 px-6 py-4 flex items-center justify-between sticky top-0 z-30">
  <!-- Left Side: Toggler & Search -->
  <div class="flex items-center gap-4 flex-1">
    <button
      (click)="toggleSidebar.emit()"
      class="p-2 rounded-xl text-slate-600 hover:bg-slate-50 transition-colors duration-200 cursor-pointer"
      aria-label="Toggle menu"
    >
      <span class="material-icons text-2xl flex items-center justify-center">menu</span>
    </button>

    <!-- Professional Search Input -->
    <div class="relative max-w-md w-full hidden md:block">
      <span class="material-icons absolute left-3.5 top-1/2 -translate-y-1/2 text-slate-400 text-lg">search</span>
      <input
        type="text"
        placeholder="Search accounts, customers, transactions..."
        class="w-full pl-10 pr-4 py-2 border border-slate-200/80 rounded-xl text-sm placeholder:text-slate-400 focus:outline-none focus:border-indigo-500 focus:ring-1 focus:ring-indigo-500/30 transition-all bg-slate-50/50"
      />
    </div>
  </div>

  <!-- Right Side: Quick Action, Alerts & Profile -->
  <div class="flex items-center gap-4">
    <!-- Quick Add button -->
    <button class="hidden sm:flex items-center gap-1.5 bg-slate-50 hover:bg-slate-100 text-slate-700 font-semibold px-4 py-2 rounded-xl text-xs border border-slate-200/60 transition-all cursor-pointer">
      <span class="material-icons text-xs">add</span>
      <span>Quick Action</span>
    </button>

    <!-- Notification Bell -->
    <button class="relative p-2 rounded-xl hover:bg-slate-50 text-slate-500 hover:text-slate-800 transition-colors duration-200 cursor-pointer">
      <span class="material-icons">notifications</span>
      <span class="absolute top-1.5 right-1.5 bg-rose-500 text-white text-[10px] rounded-full w-4.5 h-4.5 flex items-center justify-center font-bold ring-2 ring-white">
        5
      </span>
    </button>

    <!-- User Profile Dropdown -->
    <div class="flex items-center gap-3 pl-3 border-l border-slate-100">
      <img
        src="https://images.unsplash.com/photo-1573496359142-b8d87734a5a2?w=80&auto=format&fit=crop&q=80"
        alt="User Profile"
        class="w-10 h-10 rounded-xl object-cover border border-slate-200"
      />
      <div class="hidden xl:block text-left">
        <p class="text-xs font-bold text-slate-800">Sarah Jenkins</p>
        <p class="text-[10px] text-slate-400 font-medium leading-none mt-0.5">Admin Manager</p>
      </div>
    </div>
  </div>
</header>
