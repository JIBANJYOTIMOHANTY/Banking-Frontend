<div class="space-y-6 animate-in fade-in slide-in-from-bottom-2 duration-200">
  
  @if (profileSuccessMessage()) {
    <div class="p-3 bg-emerald-50 text-emerald-700 rounded-xl text-xs font-bold border border-emerald-100">
      {{ profileSuccessMessage() }}
    </div>
  }

  <div class="flex flex-col sm:flex-row items-center gap-5 p-5 bg-slate-50 rounded-2xl border border-slate-100">
    <img [src]="profileImage() || '/assets/images/Jiban.jpeg'" alt="Avatar" class="w-16 h-16 rounded-2xl object-cover border border-slate-200 shadow-sm" />
    <div class="text-center sm:text-left space-y-1">
      <h5 class="text-sm font-extrabold text-slate-800">{{ userFirstName() }} {{ userLastName() }}</h5>
      <p class="text-[10px] text-indigo-600 font-bold bg-indigo-50 px-2 py-0.5 rounded w-fit mx-auto sm:mx-0 uppercase tracking-wider">{{ userRole() }}</p>
      <p class="text-[10px] text-slate-400 font-medium">Department: Treasury & Core Operations • ID: EMP-2026-9812</p>
    </div>
  </div>

  <div class="grid grid-cols-1 sm:grid-cols-2 gap-4">
    <div class="space-y-1.5">
      <label class="text-[10px] font-bold uppercase tracking-wider text-slate-400">First Name</label>
      <input type="text" [value]="editFirstName()" (input)="onEditFirstNameInput($event)"
        class="w-full px-3.5 py-2 text-xs border border-slate-200 rounded-xl focus:outline-none focus:border-indigo-500 focus:ring-1 focus:ring-indigo-500/30 transition-all bg-white text-slate-800 font-semibold" />
    </div>
    <div class="space-y-1.5">
      <label class="text-[10px] font-bold uppercase tracking-wider text-slate-400">Last Name</label>
      <input type="text" [value]="editLastName()" (input)="onEditLastNameInput($event)"
        class="w-full px-3.5 py-2 text-xs border border-slate-200 rounded-xl focus:outline-none focus:border-indigo-500 focus:ring-1 focus:ring-indigo-500/30 transition-all bg-white text-slate-800 font-semibold" />
    </div>
    <div class="space-y-1.5 sm:col-span-2">
      <label class="text-[10px] font-bold uppercase tracking-wider text-slate-400">Email Address</label>
      <input type="email" [value]="editEmail()" (input)="onEditEmailInput($event)"
        class="w-full px-3.5 py-2 text-xs border border-slate-200 rounded-xl focus:outline-none focus:border-indigo-500 focus:ring-1 focus:ring-indigo-500/30 transition-all bg-white text-slate-800 font-semibold" />
    </div>
  </div>

  <div class="flex justify-end gap-3 pt-4 border-t border-slate-100">
    <button (click)="saveProfileChanges()"
      class="px-5 py-2.5 bg-indigo-600 hover:bg-indigo-700 text-white font-bold rounded-xl text-xs transition-all cursor-pointer shadow-md">
      Save Profile Details
    </button>
  </div>
</div>
